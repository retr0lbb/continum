name: Generate Build

on:
  workflow_dispatch:

  push: 
    tags: 
      - "v*"



jobs:
    build:
        strategy:
            matrix:
                include:
                    - os: windows-latest
                    - os: ubuntu-latest
                    - os: macos-latest
        runs-on: ${{matrix.os}}

        steps:

            - uses: actions/checkout@v4

            - name: Show Os
              run: echo $RUNNER_OS

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install Linux Deps
              if: runner.os == 'Linux'
              run: |
                sudo apt update
                sudo apt install -y \
                    libwebkit2gtk-4.1-dev \
                    build-essential \
                    curl \
                    wget \
                    libssl-dev \
                    libgtk-3-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev

            - name: show node version
              run: node --version

            - uses: dtolnay/rust-toolchain@stable

            - name: show rust installation
              run: cargo --version

            - name: Install deps
              run: npm install

            - name: Build React
              run: npm run build

            - name: tauri build
              run: npm run tauri build

            - name: Save Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: build-${{ runner.os }}
                path: src-tauri/target/release/bundle

